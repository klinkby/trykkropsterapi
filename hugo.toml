baseURL = "https://beta.trykkropsterapi.nu/"
locale = "da-dk"
defaultContentLanguage = "da"
title = "TRYK - Kropsterapi Sang Massage"

# We author every page/section/list/home template ourselves under layouts/.
# No RSS/taxonomies are part of the information architecture, so they are
# switched off to keep the build output lean and warning-free. The sitemap
# stays enabled and uses Hugo's built-in template.
disableKinds = ["RSS", "taxonomy", "term"]
enableRobotsTXT = true # genereres af layouts/robots.txt

[sitemap]
  changeFreq = "monthly"
  priority = 0.5

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Raw/unsafe HTML in Markdown stays disabled — content authors use
      # shortcodes (see layouts/shortcodes/) for anything beyond prose.
      unsafe = false
    [markup.goldmark.parser.attribute]
      # Lader indhold sætte en klasse på et afsnit, fx {.center} eller {.photo}.
      block = true

[params]
  # Beta-sitet må ikke indekseres — det ville konkurrere med det live
  # trykkropsterapi.nu om de samme tekster. Sæt til false ved skift til www.
  noindex = true

  # Alle værdier er hentet fra det nuværende www.trykkropsterapi.nu.
  logo_name    = "TRYK"
  logo_tagline = "Kropsterapi og Sang"
  business_name = "TRYK - Kropsterapi og Sang"

  address_street   = "Kigkurren 8D, st.tv."
  address_postcode = "2300"
  address_city     = "København S"

  telefon_display = "+45 26 14 89 38"
  telefon_tel     = "+4526148938"
  email           = "trykmassage@gmail.com"
  cvr             = "33888996"

  facebook_url = "https://www.facebook.com/pages/TRYK-Massage-på-Islands-Brygge/226772370714918"
  booking_url  = "https://trykkropsterapi.booqr.dk/"
