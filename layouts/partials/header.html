<header>
  <a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
  {{- with .Site.Menus.main }}
  <nav aria-label="Primær navigation">
    <ul>
      {{- range . }}
      <li><a href="{{ .URL }}"{{ if eq .URL $.RelPermalink }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  {{- end }}
</header>
